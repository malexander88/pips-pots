plugins {
    id 'com.android.application'
}

android {
    namespace 'com.lochlans.pipspots'
    compileSdk 34

    defaultConfig {
        applicationId "com.lochlans.pipspots.preview"
        minSdk 24
        targetSdk 34
        versionCode 9
        versionName "0.12.8"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
        debug {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // No AndroidX — plain framework WebView to keep the APK tiny and dependency-free
}
