<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Pip's Pots</title>
    <meta name="theme-color" content="#8fd4f8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <!-- The first 12 s of the menu music, fetched with the page so it can play straight away. -->
    <link rel="preload" href="./audio/dailybeetle-intro.ogg" as="fetch" type="audio/ogg" crossorigin />
    <script type="module" crossorigin src="/pips-pots/assets/spa-CHTMrN4l.js"></script>
    <link rel="stylesheet" crossorigin href="/pips-pots/assets/spa-D1mkA6BN.css">
    <link rel="stylesheet" href="/pips-pots/assets/c12.css">
    <script type="module" src="/pips-pots/assets/c12-b87d3564.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <!--
      release-1: old-WebView check (plain ES5, runs before the app). The build targets Chrome / WebView 111+
      and Safari 16.4+. On anything older, show a picture-only "please update" screen (no words for
      children): a phone with a circling update arrow. The app module then does not start.
    -->
    <div id="old-webview" hidden aria-label="Please update Android System WebView or Chrome" role="img">
      <svg viewBox="0 0 200 200" style="width:60vmin;height:60vmin">
        <circle cx="100" cy="100" r="92" fill="#fff7e6" stroke="#2e4168" stroke-width="8" />
        <rect x="70" y="40" width="60" height="112" rx="12" fill="#8fd4f8" stroke="#2e4168" stroke-width="8" />
        <circle cx="100" cy="136" r="5" fill="#2e4168" />
        <path d="M84 86a18 18 0 1 0 6-14" fill="none" stroke="#2e4168" stroke-width="8" stroke-linecap="round" />
        <path d="M82 60l9 13-15 3z" fill="#2e4168" stroke="#2e4168" stroke-width="4" stroke-linejoin="round" />
      </svg>
    </div>
    <script>
      (function () {
        var ua = navigator.userAgent || "";
        var old = false;
        var c = ua.match(/Chrom(?:e|ium)\/(\d+)/);
        if (c && +c[1] < 111) old = true;
        var s = !c && /Safari\//.test(ua) && ua.match(/Version\/(\d+)\.(\d+)/);
        if (s && (+s[1] < 16 || (+s[1] === 16 && +s[2] < 4))) old = true;
        try {
          if (typeof structuredClone !== "function" || !Array.prototype.at || !(window.CSS && CSS.supports && CSS.supports("color", "oklch(0 0 0)"))) old = true;
        } catch (e) {
          old = true;
        }
        if (old) {
          window.__pipOldWebView = true;
          var el = document.getElementById("old-webview");
          el.hidden = false;
          el.style.cssText = "position:fixed;top:0;left:0;width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:#8fd4f8";
        }
      })();
    </script>
  </body>
</html>
